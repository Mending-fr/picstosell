<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Photos guidées</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;font-family:'Inter Tight',system-ui,sans-serif;color:#fff;background:#0E0F12;display:flex;flex-direction:column;overflow:hidden">

<div style="padding:52px 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px">
<button type="button" aria-label="Fermer" style="width:44px;height:44px;border-radius:22px;border:0;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<div style="display:flex;flex-direction:column;align-items:center;gap:2px">
<span style="font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;background:#fff;color:#15171C;border-radius:4px;padding:2px 7px">EZ-947-MB</span>
<span style="font-size:13px;color:#C9CDD4">Photo 2 sur 6</span>
</div>
<span style="width:44px"></span>
</div>

<div style="flex:1;position:relative;margin:0 0;background:repeating-linear-gradient(135deg,#2A2C31 0 18px,#24262B 18px 36px);display:flex;align-items:center;justify-content:center">
<span style="position:absolute;top:16px;left:50%;transform:translateX(-50%);font-size:15px;font-weight:600;background:rgba(0,0,0,.55);border-radius:999px;padding:8px 14px;white-space:nowrap">Vue avant gauche</span>
<svg width="330" height="190" viewBox="0 0 330 190" fill="none" stroke="#7FA2FF" stroke-width="3" stroke-dasharray="10 8" role="img" aria-label="Silhouette à faire coïncider avec la voiture">
<path d="M20 140 L40 95 Q60 70 110 62 L200 58 Q245 60 270 85 L305 100 Q318 110 315 140 Z"></path>
<circle cx="85" cy="145" r="26"></circle><circle cx="255" cy="145" r="26"></circle>
</svg>
<div style="position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.55);border-radius:999px;padding:8px 14px">
<div style="width:90px;height:4px;background:rgba(255,255,255,.25);border-radius:2px;position:relative"><div style="position:absolute;left:40px;top:-4px;width:10px;height:12px;border-radius:3px;background:#3DDC84"></div></div>
<span style="font-size:13px;color:#3DDC84;font-weight:600">Téléphone bien droit</span>
</div>
<div style="position:absolute;top:64px;left:16px;right:16px;background:#FFF1DE;color:#6B3305;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600">Reculez d'un pas : l'arrière est coupé</div>
</div>

<div style="padding:16px 16px 28px;display:flex;flex-direction:column;gap:16px;background:#0E0F12">
<div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px">
<span style="height:6px;border-radius:3px;background:#3DDC84"></span>
<span style="height:6px;border-radius:3px;background:#7FA2FF"></span>
<span style="height:6px;border-radius:3px;background:#3A3D44"></span>
<span style="height:6px;border-radius:3px;background:#3A3D44"></span>
<span style="height:6px;border-radius:3px;background:#3A3D44"></span>
<span style="height:6px;border-radius:3px;background:#3A3D44"></span>
</div>
<div style="display:flex;align-items:center;justify-content:space-between">
<button type="button" style="font:inherit;font-size:14px;color:#C9CDD4;background:transparent;border:0;height:44px;padding:0 6px">Passer</button>
<button type="button" aria-label="Prendre la photo" style="width:76px;height:76px;border-radius:38px;border:4px solid #fff;background:transparent;display:flex;align-items:center;justify-content:center"><span style="width:60px;height:60px;border-radius:30px;background:#fff;display:block"></span></button>
<button type="button" style="font:inherit;font-size:14px;color:#C9CDD4;background:transparent;border:0;height:44px;padding:0 6px">Intérieur ›</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
