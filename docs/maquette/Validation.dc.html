<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Vérifier et mettre en ligne</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F5F2}
a{color:#1F4FD8}a:hover{color:#163A9E}
.kbd{font-family:'JetBrains Mono',monospace;font-size:12px;border:1px solid #D6D6D0;border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:#3D414A;background:#fff}
.plate{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;letter-spacing:.04em;border:1.5px solid #15171C;border-radius:4px;padding:3px 10px;background:#fff;color:#15171C}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#5B606B}
.field input,.field select,.field textarea{font:inherit;font-size:15px;color:#15171C;border:1px solid #DCDCD6;border-radius:8px;padding:0 12px;height:42px;background:#fff;box-sizing:border-box;width:100%}
.field textarea{height:auto;padding:10px 12px;line-height:1.45;resize:vertical}
</style>
</helmet>
<div style="font-family:'Inter Tight',system-ui,sans-serif;color:#15171C;background:#F5F5F2;min-height:1080px;padding:24px 40px;box-sizing:border-box;display:flex;flex-direction:column;gap:20px">

<div style="display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between">
<div style="display:flex;flex-wrap:wrap;gap:14px;align-items:center">
<a href="Main.dc.html" aria-label="Retour à l'accueil" style="width:44px;height:44px;border-radius:10px;border:1px solid #DCDCD6;background:#fff;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#15171C" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<span class="plate">GH-512-KL</span>
<h1 style="margin:0;font-size:24px;font-weight:700">Renault Clio V 1.0 TCe 90 Evolution</h1>
<span style="font-size:13px;font-weight:600;color:#8A4307;background:#FFF1DE;border-radius:999px;padding:4px 10px">Voiture 1 sur 3 à vérifier</span>
</div>
<div style="display:flex;gap:10px;flex-wrap:wrap">
<button type="button" style="font:inherit;font-size:14px;font-weight:600;height:44px;padding:0 16px;border-radius:10px;border:1px solid #DCDCD6;background:#fff;color:#15171C">Télécharger les photos</button>
<button type="button" style="font:inherit;font-size:15px;font-weight:700;height:44px;padding:0 20px;border-radius:10px;border:0;background:#0F7A4A;color:#fff;display:flex;gap:10px;align-items:center">Tout est bon, mettre en ligne <span style="font-family:'JetBrains Mono',monospace;font-size:12px;background:rgba(255,255,255,.2);border-radius:5px;padding:1px 6px">⌘ ↵</span></button>
</div>
</div>

<div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start">

<section aria-label="Photos de la voiture" style="flex:999 1 620px;min-width:0;display:flex;flex-direction:column;gap:14px">
<div style="background:#fff;border:1px solid #E4E4DF;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
<span style="font-size:16px;font-weight:700">Vue avant gauche</span>
<div role="group" aria-label="Affichage" style="display:flex;background:#F0F0EC;border-radius:8px;padding:3px">
<button type="button" style="font:inherit;font-size:13px;font-weight:600;border:0;border-radius:6px;padding:0 12px;height:34px;background:#fff;color:#15171C">Côte à côte</button>
<button type="button" style="font:inherit;font-size:13px;border:0;border-radius:6px;padding:0 12px;height:34px;background:transparent;color:#3D414A">Superposé</button>
</div>
</div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
<figure style="margin:0;display:flex;flex-direction:column;gap:8px">
<div style="aspect-ratio:4/3;border-radius:10px;background:repeating-linear-gradient(135deg,#E2E2DC 0 14px,#EAEAE5 14px 28px);display:flex;align-items:center;justify-content:center;color:#5B606B;font-size:14px;text-align:center;padding:12px">[Photo prise sur le parking, entre deux voitures]</div>
<figcaption style="font-size:13px;color:#5B606B">Avant : sur le parking</figcaption>
</figure>
<figure style="margin:0;display:flex;flex-direction:column;gap:8px">
<div style="aspect-ratio:4/3;border-radius:10px;background:#DCE3F2;display:flex;align-items:center;justify-content:center;color:#2A3A66;font-size:14px;text-align:center;padding:12px;position:relative">[La même voiture, dans votre showroom]<span style="position:absolute;top:10px;left:10px;font-size:12px;font-weight:600;background:#FFF1DE;color:#8A4307;border-radius:6px;padding:3px 8px">Regardez la jante avant</span></div>
<figcaption style="font-size:13px;color:#5B606B">Après : dans votre showroom. Seul le décor change, la carrosserie reste celle de la photo.</figcaption>
</figure>
</div>
<div style="display:flex;gap:10px;flex-wrap:wrap">
<button type="button" style="font:inherit;font-size:14px;font-weight:700;height:44px;padding:0 18px;border-radius:10px;border:0;background:#15171C;color:#fff;display:flex;gap:10px;align-items:center">C'est bon <span style="font-family:'JetBrains Mono',monospace;font-size:12px;background:rgba(255,255,255,.2);border-radius:5px;padding:1px 6px">A</span></button>
<button type="button" style="font:inherit;font-size:14px;font-weight:600;height:44px;padding:0 18px;border-radius:10px;border:1px solid #DCDCD6;background:#fff;color:#15171C;display:flex;gap:10px;align-items:center">Refaire <span class="kbd">R</span></button>
<button type="button" style="font:inherit;font-size:14px;font-weight:600;height:44px;padding:0 18px;border-radius:10px;border:1px solid #DCDCD6;background:#fff;color:#15171C;display:flex;gap:10px;align-items:center">Garder la photo du parking <span class="kbd">O</span></button>
</div>
</div>

<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px">
<sc-for list="{{shots}}" as="s" hint-placeholder-count="8">
<button type="button" style="font:inherit;text-align:left;border:2px solid {{s.ring}};border-radius:10px;background:#fff;padding:6px;display:flex;flex-direction:column;gap:6px;cursor:pointer">
<div style="aspect-ratio:4/3;border-radius:6px;background:{{s.bg}}"></div>
<span style="font-size:12px;font-weight:600;color:#15171C">{{s.label}}</span>
<span style="font-size:12px;color:{{s.stColor}}">{{s.state}}</span>
</button>
</sc-for>
</div>
</section>

<aside aria-label="L'annonce" style="flex:1 1 380px;min-width:0;background:#fff;border:1px solid #E4E4DF;border-radius:14px;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;justify-content:space-between;align-items:center">
<h2 style="margin:0;font-size:18px">L'annonce</h2>
<span style="font-size:13px;color:#0B5E39;font-weight:600">Remplie à partir de la plaque</span>
</div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
<label class="field">Prix TTC<input value="13 490 €"></label>
<label class="field">Kilométrage<input value="38 200 km"></label>
<label class="field">Boîte<select><option>Manuelle</option><option>Automatique</option></select></label>
<label class="field">Énergie<select><option>Essence</option><option>Diesel</option><option>Hybride</option><option>Électrique</option></select></label>
<label class="field">1re immatriculation<input value="03/2021"></label>
<label class="field">Puissance<input value="90 ch · 5 CV"></label>
</div>
<div style="display:flex;justify-content:space-between;align-items:center;border:1px solid #E4E4DF;border-radius:10px;padding:10px 12px;gap:10px;flex-wrap:wrap">
<div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;font-weight:600">Historique</span><span style="font-size:13px;color:#5B606B">HistoVec envoyé par le client : 1 propriétaire, contrôle technique OK</span></div>
<a href="#" style="font-size:14px;font-weight:600">Voir</a>
</div>
<label class="field">Description<textarea rows="6">Clio V Evolution de mars 2021, 38 200 km, un seul propriétaire. Écran tactile, régulateur, aide au stationnement arrière, climatisation. Entretien suivi dans le réseau Renault.</textarea></label>
<div style="display:flex;gap:10px;flex-wrap:wrap">
<button type="button" style="font:inherit;font-size:13px;font-weight:600;height:40px;padding:0 14px;border-radius:8px;border:1px solid #DCDCD6;background:#fff;color:#15171C">Réécrire le texte</button>
<button type="button" style="font:inherit;font-size:13px;font-weight:600;height:40px;padding:0 14px;border-radius:8px;border:1px solid #DCDCD6;background:#fff;color:#15171C">Équipements (24)</button>
</div>
<div style="border-top:1px solid #EFEFEA;padding-top:14px;display:flex;flex-direction:column;gap:10px">
<span style="font-size:13px;color:#5B606B;font-weight:600">Où la mettre en ligne</span>
<label style="display:flex;gap:10px;align-items:center;font-size:15px"><input type="checkbox" checked style="width:20px;height:20px">Votre site</label>
<label style="display:flex;gap:10px;align-items:center;font-size:15px"><input type="checkbox" style="width:20px;height:20px">Leboncoin et La Centrale (photos et texte prêts à copier)</label>
</div>
</aside>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const ok = { stColor: '#0B5E39', state: 'OK', ring: '#E4E4DF', bg: '#DCE3F2' };
    const shots = [
      { label: 'De face', ...ok },
      { label: 'Avant gauche', stColor: '#8A4307', state: 'À regarder', ring: '#1F4FD8', bg: '#DCE3F2' },
      { label: 'Avant droit', ...ok },
      { label: 'Côté gauche', ...ok },
      { label: 'Côté droit', stColor: '#1F4FD8', state: 'On la refait', ring: '#E4E4DF', bg: '#EEEEEA' },
      { label: 'Arrière', ...ok },
      { label: 'Intérieur', stColor: '#5B606B', state: 'Telle quelle', ring: '#E4E4DF', bg: '#E2E2DC' },
      { label: 'Compteur', stColor: '#5B606B', state: 'Telle quelle', ring: '#E4E4DF', bg: '#E2E2DC' }
    ];
    return { shots };
  }
}
</script>
</body>
</html>
